<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Productos - Herbalife</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background-color: #fff;
      color: #5c5c5c;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background-color: #ffffff;
      border-bottom: 2px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      width: 45px;
    }

    .logo h1 {
      color: #5baa4a;
      font-size: 1.8rem;
      font-family: "Poppins", sans-serif;
      margin: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 30px;
      margin: 0;
      padding: 0;
    }

    nav ul li a {
      text-decoration: none;
      color: #5baa4a;
      font-weight: bold;
      transition: 0.3s;
    }

    nav ul li a:hover {
      border-bottom: 2px solid #5baa4a;
    }

    .btn-sesion {
      background-color: #5baa4a;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-sesion:hover {
      background-color: #4b8f3f;
    }

    main {
      padding: 50px 80px;
      background-color: #f9f9f9;
      min-height: 80vh;
    }

    h2 {
      text-align: center;
      color: #5baa4a;
      font-size: 2rem;
      margin-bottom: 30px;
    }

    .busqueda {
      display: flex;
      justify-content: center;
      margin-bottom: 30px;
      gap: 10px;
    }

    .busqueda input {
      padding: 10px 15px;
      border: 1px solid #ccc;
      border-radius: 30px;
      width: 300px;
      outline: none;
      transition: 0.3s;
    }

    .busqueda input:focus {
      border-color: #5baa4a;
      box-shadow: 0 0 4px rgba(91, 170, 74, 0.5);
    }

    .busqueda button {
      background-color: #5baa4a;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 30px;
      cursor: pointer;
      transition: 0.3s;
    }

    .busqueda button:hover {
      background-color: #4b8f3f;
    }

    .grid-productos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 25px;
    }

    .producto {
      background-color: #fff;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
      padding: 20px;
      transition: transform 0.3s;
    }

    .producto:hover {
      transform: translateY(-5px);
    }

    .producto img {
      width: 100%;
      border-radius: 10px;
    }

    .producto h3 {
      color: #5baa4a;
      margin: 10px 0;
    }

    .producto p {
      color: #555;
      font-size: 0.95rem;
    }

    .producto .precio {
      font-weight: bold;
      color: #333;
      margin-top: 5px;
    }

    .producto button {
      background-color: #5baa4a;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.3s;
    }

    .producto button:hover {
      background-color: #4b8f3f;
    }

    footer {
      text-align: center;
      background-color: #5baa4a;
      color: white;
      padding: 15px;
      margin-top: 40px;
    }

    @media (max-width: 900px) {
      main {
        padding: 30px 20px;
      }

      .busqueda input {
        width: 100%;
      }
    }
    
    @media (max-width: 768px) {

      header {
        flex-direction: column;
        padding: 20px;
        gap: 15px;
        text-align: center;
      }
      
      .logo {
        justify-content: center;
      }
      
      nav {
        width: 100%;
      }
      
      nav ul {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
      }
      
      .btn-sesion {
        width: 180px;
      }
      
      .busqueda {
        flex-direction: column;
        align-items: center;
      }
      
      .busqueda input {
        width: 100%;
        max-width: 350px;
      }
      
      .grid-productos {
        grid-template-columns: 1fr;
      }

      .producto {
        max-width: 400px;
        margin: 0 auto;
      }
}
  </style>
</head>
<body>

  <header>
    <a href="index.html" class="logo">
      <img src="./img/logo.png" alt="Herbalife Logo" />
      <h1>Herbalife</h1>
    </a>

    <nav>
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="pedidos.html">Pedidos</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>

    <div>
      <a href="login.html"><button class="btn-sesion">Iniciar sesión</button></a>
    </div>
  </header>

  <main>
    <h2>Nuestros Productos</h2>

    <div class="busqueda">
      <input type="text" id="buscar" placeholder="Buscar producto...">
      <button onclick="buscarProducto()">Buscar</button>
    </div>
    
    <div class="grid-productos" id="listaProductos"></div>
  </main>

  <footer>
    <p>&copy; 2025 Herbalife - Proyecto Formativo</p>
  </footer>
  
  <script>

async function cargarProductos() {

    try {

        const respuesta = await fetch(
            "https://herbalife-backend-production.up.railway.app/api/productos"
        );

        const productos = await respuesta.json();

        const contenedor =
            document.getElementById("listaProductos");

        contenedor.innerHTML = "";

        productos.forEach(producto => {

            contenedor.innerHTML += `
                <div class="producto">
                    <img src="./img/${producto.imagen}"
                         alt="${producto.nombreProducto}">

                    <h3>${producto.nombreProducto}</h3>

                    <p>${producto.descripcion}</p>

                    <p class="precio">
                        $${Number(producto.precio).toLocaleString("es-CO")} COP
                    </p>

                    <button onclick="window.location.href='login.html'">
                        Comprar
                    </button>
                </div>
            `;
        });

    } catch (error) {
        console.error(error);
    }

}

function buscarProducto() {

    const input =
        document.getElementById("buscar")
        .value
        .toLowerCase();

    const productos =
        document.querySelectorAll(".producto");

    productos.forEach(producto => {

        const nombre =
            producto.querySelector("h3")
            .textContent
            .toLowerCase();

        producto.style.display =
            nombre.includes(input)
            ? "block"
            : "none";

    });

}

cargarProductos();

</script>

</body>
</html>

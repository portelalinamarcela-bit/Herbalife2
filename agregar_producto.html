<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agregar Producto - Herbalife</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
    padding:20px;
}

.contenedor{
    max-width:1200px;
    margin:auto;
    background:white;
    border-radius:8px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
    overflow:hidden;
}

.titulo{
    background:#5baa4a;
    color:white;
    padding:15px 20px;
    font-size:20px;
    font-weight:bold;
}

.formulario{
    padding:25px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.campo{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:8px;
    font-size:16px;
    color:#555;
}

input,
textarea,
select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;
}

textarea{
    min-height:200px;
    resize:vertical;
}

.botones{
    margin-top:20px;
    display:flex;
    justify-content:flex-end;
    gap:20px;
}

.btn{
    border:none;
    padding:12px 35px;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
    font-weight:bold;
}

.cancelar{
    background:#888;
    color:white;
}

.guardar{
    background:#5baa4a;
    color:white;
}

.guardar:hover{
    background:#3f8d30;
}

.cancelar:hover{
    background:#666;
}

@media(max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .botones{
        flex-direction:column;
    }

    .btn{
        width:100%;
    }

}

</style>
</head>
<body>

<div class="contenedor">

    <div class="titulo">
        Productos / Agregar nuevo producto
    </div>

    <form id="productoForm" class="formulario">

        <div class="grid">

            <!-- COLUMNA IZQUIERDA -->
            <div>

                <div class="campo">
                    <label>Nombre del producto</label>
                    <input type="text" id="nombreProducto" required>
                </div>

                <div class="campo">
                    <label>Descripción del producto</label>
                    <textarea id="descripcion" required></textarea>
                </div>

            </div>

            <!-- COLUMNA DERECHA -->
            <div>

                <div class="campo">
                    <label>Imagen del producto</label>
                    <input type="text" id="imagen" placeholder="img/producto.png">
                </div>

                <div class="campo">
                    <label>Categoría del producto</label>
                    <select id="id_categoria" required>
                        <option value="">Seleccione una categoría</option>
                        <option value="1">Batidos</option>
                        <option value="2">Proteínas</option>
                        <option value="3">Vitaminas</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Porción</label>
                    <input type="text" id="porcion" placeholder="550 g">
                </div>

                <div class="campo">
                    <label>Precio (COP)</label>
                    <input type="number" step="0.01" id="precio" required>
                </div>

            </div>

        </div>

        <div class="botones">
            <button type="reset" class="btn cancelar">
                CANCELAR
            </button>

            <button type="submit" class="btn guardar">
                GUARDAR
            </button>
        </div>

    </form>

</div>

<script>

document.getElementById("productoForm").addEventListener("submit", async function(e){

    e.preventDefault();

    try{

        const respuesta = await fetch("https://herbalife-backend-production.up.railway.app/api/productos",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                nombreProducto: document.getElementById("nombreProducto").value,
                descripcion: document.getElementById("descripcion").value,
                imagen: document.getElementById("imagen").value,
                porcion: document.getElementById("porcion").value,
                precio: document.getElementById("precio").value,
                id_categoria: document.getElementById("id_categoria").value

            })

        });

        const data = await respuesta.json();

        if(data.success){

            alert("Producto agregado correctamente");

            document.getElementById("productoForm").reset();

        }else{

            alert("No fue posible guardar el producto");

        }

    }catch(error){

        console.error(error);

        alert("Error de conexión con el servidor");

    }

});

</script>

</body>
</html>

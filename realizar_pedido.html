<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realizar Pedido - Herbalife</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    margin:0;
    background:#f9f9f9;
}

.container{
    max-width:600px;
    margin:50px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

h2{
    text-align:center;
    color:#5baa4a;
}

.form-group{
    margin-bottom:15px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#5baa4a;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#4b8f3f;
}

</style>
</head>

<body>

<div class="container">

    <h2>Realizar Pedido</h2>

    <form id="pedidoForm">

        <div class="form-group">
            <label>Ubicación de entrega</label>
            <input
                type="text"
                id="ubicacion"
                required>
        </div>

        <div class="form-group">
            <label>Método de Pago</label>

            <select id="metodo_pago" required>
                <option value="">Seleccione...</option>
                <option>Nequi</option>
                <option>Daviplata</option>
                <option>Transferencia</option>
                <option>Efectivo</option>
            </select>
        </div>

        <div class="form-group">
            <label>Total</label>

            <input
                type="number"
                id="total"
                required>
        </div>

        <button type="submit">
            Realizar Pedido
        </button>

    </form>

</div>

<script>

document.getElementById("pedidoForm")
.addEventListener("submit", async function(e){

    e.preventDefault();

    const respuesta = await fetch(
        "http://127.0.0.1:3000/api/pedidos",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({

                id_usuario:1,
                ubicacion:
                    document.getElementById("ubicacion").value,

                metodo_pago:
                    document.getElementById("metodo_pago").value,

                total:
                    document.getElementById("total").value
            })
        }
    );

    const data = await respuesta.json();

    if(data.success){

        alert("Pedido registrado correctamente");

        window.location.href="pedidos.html";

    }else{

        alert("Error al registrar pedido");

    }

});

</script>

</body>
</html>
